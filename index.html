<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBA Teknoloji</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EAEEF1; --panel:#F7F9FA; --panel-2:#FFFFFF;
  --ink:#0E2233; --ink-2:#3A5165; --ink-3:#65798A;
  --line:#C6D2DA; --line-soft:#DCE4EA;
  --deep:#1C4E6B; --shoal:#2E7D8F; --flag:#AB4B13;
  --soil:#D7D2C6; --soil-line:#B3AB99;
  --l1:#7B4A21; --l2:#2B2B2B; --l3:#8C8C8C; --n:#2D6BB5; --pe:#2E7D32;
  --su:#1E88C7; --atik:#6B6256; --yangin:#C62828; --hvac:#7E8FA6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1824; --panel:#122534; --panel-2:#0F1E2B;
  --ink:#DEE8EE; --ink-2:#A3B6C3; --ink-3:#7A8F9E;
  --line:#2B4255; --line-soft:#1E3344;
  --deep:#6FB6D4; --shoal:#5FB3BF; --flag:#E8873D;
  --soil:#1B2A33; --soil-line:#36505E;
  --l1:#C08A55; --l2:#9AA6AE; --l3:#C3CCD2; --n:#6AA8E8; --pe:#6DBE72;
  --su:#5BB6EA; --atik:#A89B86; --yangin:#F06B6B; --hvac:#9FB3C9;
}}
:root[data-theme="dark"]{
  --ground:#0B1824; --panel:#122534; --panel-2:#0F1E2B;
  --ink:#DEE8EE; --ink-2:#A3B6C3; --ink-3:#7A8F9E;
  --line:#2B4255; --line-soft:#1E3344;
  --deep:#6FB6D4; --shoal:#5FB3BF; --flag:#E8873D;
  --soil:#1B2A33; --soil-line:#36505E;
  --l1:#C08A55; --l2:#9AA6AE; --l3:#C3CCD2; --n:#6AA8E8; --pe:#6DBE72;
  --su:#5BB6EA; --atik:#A89B86; --yangin:#F06B6B; --hvac:#9FB3C9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding-block:34px 60px;padding-left:16px;padding-right:16px;
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16.5px;line-height:1.62;
}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:38px}
.eyebrow{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:11.5px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--shoal);margin:0 0 9px}
h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
  font-size:clamp(32px,7vw,52px);line-height:1.02;letter-spacing:-.012em;margin:0 0 14px;text-wrap:balance}
.lead{margin:0;font-size:18.5px;line-height:1.52;color:var(--ink-2);max-width:66ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 30px;margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}
.meta div{font-size:13.5px;color:var(--ink)}
.meta b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
h2{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13.5px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px}
.thesis{border-left:3px solid var(--flag);padding:16px 0 16px 21px;font-size:22px;line-height:1.38;max-width:56ch}
.thesis span{color:var(--ink-3)}
figure{margin:0}
svg.flow{display:block;width:100%;height:auto;color:var(--ink);background:var(--panel);
  border:1px solid var(--line-soft);padding:12px}
figcaption{margin-top:11px;font-size:13.5px;color:var(--ink-3);max-width:70ch}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(296px,1fr));gap:16px}
.job{background:var(--panel);border:1px solid var(--line-soft);padding:20px 19px;display:flex;flex-direction:column;gap:11px}
.job .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--shoal);letter-spacing:.09em}
.job h3{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:21px;margin:0;line-height:1.14}
.job p{margin:0;font-size:15.5px;color:var(--ink-2)}
.job dl{margin:4px 0 0;display:flex;flex-direction:column;gap:7px}
.job .r{display:grid;grid-template-columns:76px 1fr;gap:11px;font-size:14px;align-items:baseline}
.job dt{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.job dd{margin:0;color:var(--ink)}
.job dd.act{color:var(--deep);font-weight:500}
.stage{display:grid;grid-template-columns:1fr 316px;gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.draw{background:var(--panel);border:1px solid var(--line-soft);padding:10px}
svg.sec{display:block;width:100%;height:auto;color:var(--ink)}
.el{cursor:pointer}
.el .hit{stroke:transparent;fill:none;stroke-width:17;pointer-events:stroke}
.el rect.hit{fill:transparent;stroke:none;pointer-events:all}
.el:hover .vis{stroke-width:6}
.el:focus{outline:none}
.el.sel .halo{opacity:1}
.halo{opacity:0;transition:opacity .12s}
.dim{opacity:.17}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.filters button{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--panel);color:var(--ink-2);
  border:1px solid var(--line);padding:7px 13px;cursor:pointer;border-radius:2px}
.filters button:hover{border-color:var(--shoal);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--ground)}
.filters button:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line-soft);padding:17px 16px;position:sticky;top:18px}
.card .kod{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--shoal);margin:0 0 3px}
.card h3{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:20px;margin:0 0 3px;line-height:1.15}
.card .sis{font-size:13px;color:var(--ink-3);margin:0 0 13px}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.rowline:last-of-type{border-bottom:0}
.rowline dt{color:var(--ink-3);white-space:nowrap}
.rowline dd{margin:0;text-align:right;color:var(--ink);font-weight:500}
.seal{margin-top:13px;border:1px solid var(--deep);background:var(--panel-2);padding:11px 12px}
.seal b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--deep);margin-bottom:5px}
.seal code{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);word-break:break-all}
.seal.open{border-color:var(--flag)} .seal.open b{color:var(--flag)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;
  background:var(--panel);border:1px solid var(--line-soft);padding:15px;margin-top:16px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.sw{width:24px;height:4px;flex:none;border-radius:2px}
.scroll{overflow-x:auto;border:1px solid var(--line-soft)}
table{border-collapse:collapse;width:100%;min-width:660px;background:var(--panel);font-size:15px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{font-weight:600;white-space:nowrap}
td.ok{color:var(--shoal)} td.no{color:var(--flag)}
tr:last-child td{border-bottom:0}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ph{border-top:3px solid var(--deep);background:var(--panel);padding:16px}
.ph:nth-child(2){border-top-color:var(--shoal)}
.ph:nth-child(3){border-top-color:var(--flag)}
.ph b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.ph h3{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:19px;margin:0 0 7px}
.ph p{margin:0;font-size:15px;color:var(--ink-2)}
ul{margin:0;padding-left:19px}
li{margin-bottom:8px;color:var(--ink-2)}
li b{color:var(--ink);font-weight:600}
.feedwrap{display:grid;grid-template-columns:1fr 212px;gap:16px;align-items:start}
@media (max-width:760px){.feedwrap{grid-template-columns:1fr}}
.feed{background:var(--panel);border:1px solid var(--line-soft);padding:6px 0;min-height:316px;overflow:hidden}
.ev{display:grid;grid-template-columns:58px 1fr 104px;gap:12px;align-items:baseline;
  padding:9px 16px;border-bottom:1px solid var(--line-soft);font-size:14px;
  animation:slide .34s ease-out both}
.ev:last-child{border-bottom:0}
@keyframes slide{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ev{animation:none}}
.ev time{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3)}
.ev .txt{color:var(--ink)}
.ev .txt small{display:block;color:var(--ink-3);font-size:12.5px}
.ev .tag{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;text-align:right}
.ev.auto .tag{color:var(--shoal)}
.ev.human .tag{color:var(--flag)}
.ev.human{box-shadow:inset 3px 0 0 var(--flag)}
.ev.auto{box-shadow:inset 3px 0 0 var(--shoal)}
.tally{background:var(--panel);border:1px solid var(--line-soft);padding:16px;position:sticky;top:18px}
.tally div{margin-bottom:15px}
.tally div:last-child{margin-bottom:0}
.tally b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.tally s{text-decoration:none;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
  font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tally .a s{color:var(--shoal)} .tally .h s{color:var(--flag)}
.auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:14px;margin-top:18px}
.lv{background:var(--panel);border:1px solid var(--line-soft);border-left:4px solid var(--shoal);padding:15px 16px}
.lv:nth-child(2){border-left-color:var(--deep)}
.lv:nth-child(3){border-left-color:var(--flag)}
.lv b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.09em;color:var(--ink-3);display:block;margin-bottom:4px}
.lv h3{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:19px;margin:0 0 6px}
.lv p{margin:0;font-size:14.5px;color:var(--ink-2)}
.bba{background:var(--panel);border:1px solid var(--line);padding:22px 20px}
.bba ul{padding-left:19px;margin:0}
.bba li{margin-bottom:11px;font-size:15.5px}
.bba li:last-child{margin-bottom:0}
footer{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--ink-3);
  display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:space-between}
</style>
<style>
#gate{min-height:78vh;display:flex;align-items:center;justify-content:center}
#gate .box{background:var(--panel);border:1px solid var(--line);padding:30px 28px;max-width:380px;width:100%}
#gate .mark{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--shoal);margin:0 0 10px}
#gate h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:28px;margin:0 0 8px}
#gate p{margin:0 0 20px;color:var(--ink-2);font-size:15px}
#gate form{display:flex;gap:9px}
#gate input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:11px 13px;font-family:"IBM Plex Mono",monospace;font-size:15px;border-radius:2px}
#gate input:focus{outline:2px solid var(--shoal);outline-offset:1px}
#gate button{background:var(--deep);border:1px solid var(--deep);color:var(--ground);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;padding:11px 18px;cursor:pointer;border-radius:2px}
#gate .err{color:var(--flag);font-size:14px;margin:14px 0 0;min-height:20px}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <p class="mark">BBA Teknoloji</p>
    <h1>Protected</h1>
    <p>This pack is shared with named recipients. Enter the passphrase you were given.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="passphrase" aria-label="Passphrase" autocomplete="off">
      <button type="submit">Open</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </div>
</div>
<div id="content" hidden></div>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:d64(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(NONCE)},key,d64(BLOB));
  const html=new TextDecoder().decode(plain);
  const host=document.getElementById("content");
  host.innerHTML=html; host.hidden=false;
  document.getElementById("gate").remove();
  host.querySelectorAll("script").forEach(old=>{
    const s=document.createElement("script");
    s.textContent=old.textContent; old.replaceWith(s);
  });
  try{ sessionStorage.setItem("k",pw); }catch(e){}
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"); err.textContent="";
  try{ await open_(document.getElementById("pw").value.trim()); }
  catch(x){ err.textContent="Not the right passphrase."; }
});
(async()=>{ try{ const k=sessionStorage.getItem("k"); if(k) await open_(k); }catch(e){} })();
</script>
